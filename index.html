<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMOS — Explore the Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dim: rgba(201,168,76,0.15);
    --white: #f0ede6;
    --dim: rgba(240,237,230,0.45);
    --dimmer: rgba(240,237,230,0.18);
    --bg: #04040a;
    --nebula1: #0d0620;
    --nebula2: #060d1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Crimson Pro', Georgia, serif;
    overflow: hidden;
    cursor: none;
  }

  /* ─── Custom cursor ─── */
  #cursor {
    position: fixed; width: 8px; height: 8px;
    background: var(--gold); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, opacity 0.2s;
    mix-blend-mode: screen;
  }
  #cursor-ring {
    position: fixed; width: 32px; height: 32px;
    border: 1px solid rgba(201,168,76,0.5); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.35s cubic-bezier(.25,.46,.45,.94),
                height 0.35s cubic-bezier(.25,.46,.45,.94),
                opacity 0.3s;
  }

  canvas { display: block; position: fixed; inset: 0; z-index: 0; }

  /* ─── Header ─── */
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 28px 48px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(4,4,10,0.85) 0%, transparent 100%);
  }
  #logo {
    font-family: 'Cinzel', serif;
    font-size: 20px; font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
  }
  #logo span { color: var(--white); font-weight: 400; }

  #nav { display: flex; gap: 36px; align-items: center; }
  #nav a {
    font-family: 'Cinzel', serif;
    font-size: 11px; font-weight: 400;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--dim); text-decoration: none;
    transition: color 0.3s;
  }
  #nav a:hover { color: var(--gold); }

  #nav .btn-cta {
    padding: 9px 22px;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 2px;
    font-size: 10px;
    letter-spacing: 2.5px;
    transition: background 0.3s, color 0.3s;
  }
  #nav .btn-cta:hover {
    background: var(--gold);
    color: var(--bg);
  }

  /* ─── Hero ─── */
  #hero {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; pointer-events: none;
  }

  #eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 10px; letter-spacing: 6px;
    color: var(--gold); opacity: 0.8;
    margin-bottom: 20px;
    animation: fadeUp 1.2s 0.3s both;
  }

  #title-main {
    font-family: 'Cinzel', serif;
    font-size: clamp(56px, 8vw, 112px);
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: 0.06em;
    text-align: center;
    color: var(--white);
    text-shadow: 0 0 80px rgba(201,168,76,0.2),
                 0 0 200px rgba(100,60,180,0.15);
    animation: fadeUp 1.2s 0.5s both;
  }
  #title-main em {
    font-style: italic;
    color: var(--gold-light);
    font-weight: 400;
  }

  #subtitle {
    font-size: 18px; font-weight: 300;
    font-style: italic;
    color: var(--dim); letter-spacing: 1px;
    margin-top: 20px; text-align: center;
    max-width: 480px; line-height: 1.6;
    animation: fadeUp 1.2s 0.7s both;
  }

  #divider-gold {
    width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 28px 0;
    animation: fadeUp 1.2s 0.9s both;
  }

  #hero-cta {
    display: flex; gap: 16px;
    animation: fadeUp 1.2s 1.1s both;
    pointer-events: all;
  }
  .btn-primary {
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 3px;
    padding: 14px 36px;
    background: var(--gold);
    color: var(--bg);
    border: none; border-radius: 2px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    text-transform: uppercase;
  }
  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-1px);
  }
  .btn-secondary {
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 3px;
    padding: 14px 36px;
    background: transparent;
    color: var(--dim);
    border: 1px solid rgba(240,237,230,0.2);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
    text-transform: uppercase;
  }
  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* ─── Stats bar ─── */
  #stats {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex;
    background: linear-gradient(to top, rgba(4,4,10,0.9), transparent);
    padding: 32px 64px 28px;
    z-index: 100;
    animation: fadeUp 1.2s 1.3s both;
  }
  .stat {
    flex: 1; text-align: center;
    border-right: 1px solid rgba(240,237,230,0.08);
  }
  .stat:last-child { border-right: none; }
  .stat-num {
    font-family: 'Cinzel', serif;
    font-size: 28px; color: var(--gold);
    letter-spacing: 2px;
  }
  .stat-label {
    font-size: 11px; color: var(--dimmer);
    letter-spacing: 2px; margin-top: 4px;
    text-transform: uppercase; font-family: 'Cinzel', serif;
  }

  /* ─── Controls ─── */
  #controls {
    position: fixed; right: 40px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
    z-index: 100;
    animation: fadeIn 1.5s 1.5s both;
  }
  .ctrl-btn {
    font-family: 'Cinzel', serif;
    font-size: 9px; letter-spacing: 2px;
    padding: 10px 14px;
    background: rgba(4,4,10,0.7);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--dim); cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.3s, color 0.3s, background 0.3s;
    backdrop-filter: blur(12px);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }

  /* ─── Planet info tooltip ─── */
  #planet-info {
    position: fixed; left: 48px; bottom: 120px;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  #planet-info.visible { opacity: 1; }
  #planet-name {
    font-family: 'Cinzel', serif;
    font-size: 22px; color: var(--gold);
    letter-spacing: 3px;
  }
  #planet-desc {
    font-size: 14px; font-style: italic;
    color: var(--dim); margin-top: 6px;
    max-width: 220px; line-height: 1.7;
  }
  #planet-bar {
    width: 40px; height: 1px;
    background: var(--gold); margin: 10px 0;
  }

  /* ─── Scan line overlay ─── */
  #scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px
    );
    pointer-events: none; z-index: 50;
  }

  /* ─── Vignette ─── */
  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(4,4,10,0.7) 100%);
    pointer-events: none; z-index: 5;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  @media (max-width: 768px) {
    #header { padding: 20px 24px; }
    #nav a:not(.btn-cta) { display: none; }
    #stats { padding: 20px 24px; }
    .stat-num { font-size: 20px; }
    #controls { right: 16px; }
    #planet-info { left: 24px; bottom: 100px; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="scanlines"></div>
<div id="vignette"></div>

<header id="header">
  <div id="logo">COSMOS<span> · OBSERVATORY</span></div>
  <nav id="nav">
    <a href="#">Planets</a>
    <a href="#">Deep Sky</a>
    <a href="#">Missions</a>
    <a href="#" class="btn-cta">Launch Simulator</a>
  </nav>
</header>

<div id="hero">
  <div id="eyebrow">EST. 4.6 BILLION YEARS AGO</div>
  <h1 id="title-main">THE<br><em>COSMOS</em></h1>
  <p id="subtitle">An interactive journey through our solar system — from the blazing corona of the Sun to the frozen outer reaches of Neptune.</p>
  <div id="divider-gold"></div>
  <div id="hero-cta">
    <button class="btn-primary" onclick="startExplore()">Begin Exploration</button>
    <button class="btn-secondary" onclick="toggleOrbits()">Toggle Orbits</button>
  </div>
</div>

<div id="planet-info">
  <div id="planet-name">—</div>
  <div id="planet-bar"></div>
  <div id="planet-desc">—</div>
</div>

<div id="controls">
  <button class="ctrl-btn active" id="btn-rotate" onclick="toggleAutoRotate()">AUTO·ROTATE</button>
  <button class="ctrl-btn" id="btn-orbits" onclick="toggleOrbits()">ORBITS</button>
  <button class="ctrl-btn" onclick="resetCamera()">RESET VIEW</button>
  <button class="ctrl-btn" onclick="focusSun()">FOCUS SUN</button>
</div>

<div id="stats">
  <div class="stat">
    <div class="stat-num" id="cnt-planets">8</div>
    <div class="stat-label">Planets</div>
  </div>
  <div class="stat">
    <div class="stat-num">4.6B</div>
    <div class="stat-label">Years Old</div>
  </div>
  <div class="stat">
    <div class="stat-num">1AU</div>
    <div class="stat-label">Scale Model</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="cnt-stars">12K</div>
    <div class="stat-label">Background Stars</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Custom cursor ───
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mx = -200, my = -200, rx = -200, ry = -200;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function animCursor() {
  requestAnimationFrame(animCursor);
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  cursorRing.style.left = rx + 'px'; cursorRing.style.top = ry + 'px';
})();

// ─── Scene ───
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04040a, 0.00012);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 8000);
camera.position.set(90, 55, 130);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 4; controls.maxDistance = 600;
controls.autoRotate = true; controls.autoRotateSpeed = 0.25;

// ─── Post-processing ───
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.25, 0.08);
composer.addPass(bloom);

// ─── Starfield ───
function makeStars(count, rMin, rMax) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sz  = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = rMin + Math.random() * (rMax - rMin);
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = r * Math.sin(p) * Math.sin(t);
    pos[i*3+2] = r * Math.cos(p);
    const c = new THREE.Color();
    const h = Math.random();
    if (h < 0.08)       c.setHSL(0.6, 0.9, 0.8);   // blue
    else if (h < 0.14)  c.setHSL(0.08, 0.9, 0.9);  // orange
    else                c.setHSL(0, 0, 0.65 + Math.random() * 0.35);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    sz[i] = 0.4 + Math.random() * 2.2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.0, vertexColors: true, transparent: true, opacity: 0.88,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  }));
}
scene.add(makeStars(14000, 250, 2000));

// ─── Nebula / galaxy haze ───
{
  const geo = new THREE.BufferGeometry();
  const n = 6000;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 40 + Math.random() * 180;
    const a = Math.random() * Math.PI * 2;
    const sp = (Math.random() - 0.5) * 6 * (r / 90);
    pos[i*3]   = Math.cos(a) * r + sp * Math.sin(a);
    pos[i*3+1] = (Math.random() - 0.5) * 5;
    pos[i*3+2] = Math.sin(a) * r - sp * Math.cos(a);
    // Subtle purple/blue nebula tones
    const h = 0.7 + Math.random() * 0.12;
    const c = new THREE.Color().setHSL(h, 0.5, 0.08 + Math.random() * 0.12);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 5, vertexColors: true, transparent: true, opacity: 0.22,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  })));
}

// ─── Sun ───
const sunGeo = new THREE.SphereGeometry(6.5, 64, 64);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd060 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);
// Corona layers
[{ r: 8.5, c: 0xff9933, o: 0.18 }, { r: 12, c: 0xff6611, o: 0.07 }, { r: 18, c: 0xff3300, o: 0.03 }]
  .forEach(({ r, c, o }) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 32),
      new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o }));
    scene.add(m);
  });
const sunLight = new THREE.PointLight(0xffd060, 2.5, 800);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x1a1a2e, 0.5));

// ─── Planets ───
const PLANET_DATA = [
  { name: 'Mercury', desc: 'Smallest planet, closest to the Sun. Surface temperatures swing 600°C.',
    size: 0.85, dist: 13,  color: 0xb08860, emissive: 0x201008, speed: 0.82, tilt: 0.03, rings: false },
  { name: 'Venus',   desc: 'Hottest planet at 465°C. Dense atmosphere of sulfuric acid clouds.',
    size: 1.25, dist: 20,  color: 0xe8c070, emissive: 0x301808, speed: 0.52, tilt: 2.64, rings: false },
  { name: 'Earth',   desc: 'Our pale blue dot. The only known harbour of life in the cosmos.',
    size: 1.35, dist: 28,  color: 0x4488dd, emissive: 0x081830, speed: 0.41, tilt: 0.41, rings: false },
  { name: 'Mars',    desc: 'The Red Planet. Home to Olympus Mons, the tallest volcano in the solar system.',
    size: 1.05, dist: 36,  color: 0xcc5533, emissive: 0x200808, speed: 0.31, tilt: 0.44, rings: false },
  { name: 'Jupiter', desc: 'The giant. More mass than all other planets combined. 95 known moons.',
    size: 3.2,  dist: 52,  color: 0xddbb88, emissive: 0x201005, speed: 0.16, tilt: 0.05, rings: false },
  { name: 'Saturn',  desc: 'Lord of the rings. Its iconic ring system spans 282,000 km.',
    size: 2.7,  dist: 68,  color: 0xeecc99, emissive: 0x201508, speed: 0.11, tilt: 0.47, rings: true  },
  { name: 'Uranus',  desc: 'The ice giant that rotates on its side, tilted 98° from its orbital plane.',
    size: 2.0,  dist: 84,  color: 0x99ccee, emissive: 0x081828, speed: 0.075, tilt: 1.71, rings: false },
  { name: 'Neptune', desc: 'The windiest world. Supersonic storms race at 2,000 km/h in eternal darkness.',
    size: 1.9,  dist: 100, color: 0x4466cc, emissive: 0x080818, speed: 0.05, tilt: 0.49, rings: false },
];

const planets = [];
const orbitMeshes = [];
let orbitsVisible = false;

PLANET_DATA.forEach(data => {
  // Orbit ring
  const pts = [];
  for (let i = 0; i <= 192; i++) {
    const a = (i / 192) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * data.dist, 0, Math.sin(a) * data.dist));
  }
  const orbitLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.0 })
  );
  scene.add(orbitLine);
  orbitMeshes.push(orbitLine);

  // Planet mesh
  const geo = new THREE.SphereGeometry(data.size, 48, 48);
  const mat = new THREE.MeshStandardMaterial({
    color: data.color, roughness: 0.65, metalness: 0.05,
    emissive: data.emissive, emissiveIntensity: 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.z = data.tilt;
  scene.add(mesh);

  // Saturn rings
  if (data.rings) {
    const rGeo = new THREE.RingGeometry(data.size * 1.35, data.size * 2.6, 80);
    const rMat = new THREE.MeshBasicMaterial({
      color: 0xd4bc88, side: THREE.DoubleSide, transparent: true, opacity: 0.55
    });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = Math.PI / 2.6;
    mesh.add(ring);
  }

  // Jupiter bands (simple texture-like material)
  if (data.name === 'Jupiter') {
    const bandGeo = new THREE.SphereGeometry(data.size + 0.05, 48, 48);
    const bandMat = new THREE.MeshBasicMaterial({
      color: 0xcc9944, transparent: true, opacity: 0.12,
      wireframe: false
    });
  }

  planets.push({
    mesh, dist: data.dist, speed: data.speed,
    angle: Math.random() * Math.PI * 2,
    name: data.name, desc: data.desc
  });
});

// ─── Raycaster for hover ───
const raycaster = new THREE.Raycaster();
const mouse2d = new THREE.Vector2();
const planetInfo = document.getElementById('planet-info');
const planetName = document.getElementById('planet-name');
const planetDesc = document.getElementById('planet-desc');
let hoveredPlanet = null;

document.addEventListener('mousemove', e => {
  mouse2d.x = (e.clientX / innerWidth) * 2 - 1;
  mouse2d.y = -(e.clientY / innerHeight) * 2 + 1;
});

// ─── Controls ───
window.toggleOrbits = function() {
  orbitsVisible = !orbitsVisible;
  const btn = document.getElementById('btn-orbits');
  orbitMeshes.forEach(l => {
    l.material.opacity = orbitsVisible ? 0.35 : 0.0;
  });
  btn.classList.toggle('active', orbitsVisible);
};

window.toggleAutoRotate = function() {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('btn-rotate').classList.toggle('active', controls.autoRotate);
};

window.resetCamera = function() {
  camera.position.set(90, 55, 130);
  controls.target.set(0, 0, 0);
};

window.focusSun = function() {
  camera.position.set(18, 8, 22);
  controls.target.set(0, 0, 0);
};

window.startExplore = function() {
  window.toggleOrbits();
  controls.autoRotate = false;
  document.getElementById('btn-rotate').classList.remove('active');
};

// ─── Animation loop ───
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  sun.rotation.y += 0.0015;

  planets.forEach(p => {
    p.angle += 0.008 * p.speed;
    p.mesh.position.set(Math.cos(p.angle) * p.dist, 0, Math.sin(p.angle) * p.dist);
    p.mesh.rotation.y += 0.008;
  });

  // Hover detection
  raycaster.setFromCamera(mouse2d, camera);
  const meshes = planets.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    const hit = planets.find(p => p.mesh === hits[0].object);
    if (hit && hit !== hoveredPlanet) {
      hoveredPlanet = hit;
      planetName.textContent = hit.name.toUpperCase();
      planetDesc.textContent = hit.desc;
      planetInfo.classList.add('visible');
      cursor.style.width = '14px';
      cursor.style.height = '14px';
      cursorRing.style.width = '50px';
      cursorRing.style.height = '50px';
    }
  } else {
    if (hoveredPlanet) {
      hoveredPlanet = null;
      planetInfo.classList.remove('visible');
      cursor.style.width = '8px';
      cursor.style.height = '8px';
      cursorRing.style.width = '32px';
      cursorRing.style.height = '32px';
    }
  }

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
