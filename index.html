<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMOS — Explore the Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dim: rgba(201,168,76,0.15);
    --white: #f0ede6;
    --dim: rgba(240,237,230,0.45);
    --dimmer: rgba(240,237,230,0.18);
    --bg: #04040a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Crimson Pro', Georgia, serif;
  }
  canvas { display: block; position: fixed; inset: 0; }

  #loading {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.8s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 900;
    letter-spacing: 12px;
    color: var(--gold);
    text-shadow: 0 0 60px rgba(201,168,76,0.3);
    margin-bottom: 8px;
  }
  #loading-sub {
    font-style: italic;
    color: var(--dim);
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 40px;
  }
  #loading-bar-wrap {
    width: 240px; height: 2px;
    background: rgba(240,237,230,0.08);
    border-radius: 1px; overflow: hidden;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background: linear-gradient(to right, var(--gold), var(--gold-light));
    transition: width 0.3s;
    border-radius: 1px;
  }
  #loading-pct {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--dim);
    margin-top: 12px;
    letter-spacing: 2px;
  }
  #loading-tip {
    font-size: 13px;
    font-style: italic;
    color: var(--dimmer);
    margin-top: 32px;
    opacity: 0;
    transition: opacity 0.5s;
    max-width: 320px;
    text-align: center;
    line-height: 1.5;
  }
  #loading-tip.show { opacity: 1; }

  #cursor {
    position: fixed; width: 8px; height: 8px;
    background: var(--gold); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s;
    mix-blend-mode: screen;
  }
  #cursor-ring {
    position: fixed; width: 32px; height: 32px;
    border: 1px solid rgba(201,168,76,0.5); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.35s cubic-bezier(.25,.46,.45,.94),
                height 0.35s cubic-bezier(.25,.46,.45,.94);
  }

  #header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 24px 40px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(4,4,10,0.85) 0%, transparent 100%);
    pointer-events: none;
  }
  #header > * { pointer-events: auto; }
  #logo {
    font-family: 'Cinzel', serif;
    font-size: 18px; font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
  }
  #logo span { color: var(--white); font-weight: 400; }

  #planet-label {
    position: fixed; left: 40px; bottom: 120px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.4s, transform 0.4s;
    transform: translateY(8px);
  }
  #planet-label.visible { opacity: 1; transform: translateY(0); }
  #planet-label .name {
    font-family: 'Cinzel', serif;
    font-size: 24px; color: var(--gold);
    letter-spacing: 4px;
  }
  #planet-label .bar {
    width: 40px; height: 1px;
    background: var(--gold); margin: 8px 0;
  }
  #planet-label .desc {
    font-size: 14px; font-style: italic;
    color: var(--dim);
    max-width: 240px; line-height: 1.7;
  }
  #planet-label .stat-row {
    display: flex; gap: 20px; margin-top: 8px;
  }
  #planet-label .stat-row div {
    font-size: 11px;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    color: var(--dimmer);
  }
  #planet-label .stat-row span {
    color: var(--gold-light);
  }

  #controls {
    position: fixed; right: 24px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 4px;
    z-index: 100;
  }
  .ctrl-btn {
    font-family: 'Cinzel', serif;
    font-size: 9px; letter-spacing: 2px;
    padding: 10px 14px;
    background: rgba(4,4,10,0.7);
    border: 1px solid rgba(201,168,76,0.15);
    color: var(--dim); cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.3s, color 0.3s, background 0.3s;
    backdrop-filter: blur(12px);
    text-transform: uppercase;
    white-space: nowrap;
    text-align: left;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }
  .ctrl-btn .key-hint {
    display: inline-block;
    font-size: 8px;
    color: var(--dimmer);
    margin-left: 6px;
    border: 1px solid rgba(240,237,230,0.1);
    padding: 1px 4px;
    border-radius: 2px;
  }

  #scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,0.02) 3px, rgba(0,0,0,0.02) 4px
    );
    pointer-events: none; z-index: 50;
  }

  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(4,4,10,0.7) 100%);
    pointer-events: none; z-index: 5;
  }

  #notif {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 200;
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 3px;
    color: var(--gold);
    background: rgba(4,4,10,0.8);
    padding: 10px 24px;
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    opacity: 0;
    transition: opacity 0.4s, transform 0.4s;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  #notif.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  @media (max-width: 768px) {
    #header { padding: 16px 20px; }
    #controls { right: 12px; }
    .ctrl-btn { padding: 8px 10px; font-size: 8px; }
    .ctrl-btn .key-hint { display: none; }
    #planet-label { left: 20px; bottom: 100px; }
    #planet-label .name { font-size: 18px; }
    #planet-label .desc { font-size: 12px; max-width: 180px; }
  }
</style>
  <script type="module" crossorigin src="./assets/index-D4KI_czR.js"></script>
</head>
<body>

<div id="loading">
  <div id="loading-title">COSMOS</div>
  <div id="loading-sub">Loading the universe</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-pct">0%</div>
  <div id="loading-tip"></div>
</div>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="notif"></div>

<header id="header">
  <div id="logo">COSMOS<span> · OBSERVATORY</span></div>
</header>

<div id="planet-label">
  <div class="name"></div>
  <div class="bar"></div>
  <div class="desc"></div>
  <div class="stat-row">
    <div>DIST <span id="pl-dist"></span></div>
    <div>DIAM <span id="pl-diam"></span></div>
    <div>YEAR <span id="pl-year"></span></div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn active" id="btn-rotate" title="Toggle auto-rotation">
    <span class="key-hint">SPACE</span> ROTATE
  </button>
  <button class="ctrl-btn" id="btn-orbits" title="Toggle orbit lines">
    <span class="key-hint">O</span> ORBITS
  </button>
  <button class="ctrl-btn" id="btn-labels" title="Toggle planet labels">
    <span class="key-hint">L</span> LABELS
  </button>
  <button class="ctrl-btn" id="btn-reset" title="Reset camera">
    <span class="key-hint">R</span> RESET
  </button>
</div>

</body>
</html>
